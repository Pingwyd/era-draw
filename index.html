<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d1f">
<title>Era Draw</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div id="xptop"><i id="xpb"></i></div><span id="lvt">LV 1</span>
  <div id="hudL"><b>HEALTH</b><div class="hbar"><i id="hpb"></i></div><span id="hpt"></span></div>
  <div id="hudC"><div id="timer">0:00</div><div id="wave">WAVE 1</div></div>
  <div id="hudR"><span id="kills">0</span><img id="icSkull" alt=""><span id="runcoins">0</span><img id="icCoin" alt=""></div>
  <div id="slots"></div>
  <button id="pauseBtn" aria-label="Pause">II</button>
</div>
<div id="bossbar" class="hidden"><div class="bb-name"><span id="bbName"></span><small id="bbTitle"></small></div><div class="bb-frame"><i id="bbFill"></i><span id="bbHp"></span></div></div>
<div id="toast"></div>
<div id="screen"></div>
<div id="rotate" class="hidden"><div class="rot-ic">📱</div><h2>Rotate your phone</h2><div class="sub">Era Draw plays in landscape</div></div>
<script src="sprites.js"></script>
<script src="enemies.js"></script>
<script src="game.js"></script>
</body></html>
