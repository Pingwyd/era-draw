<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120d1f">
<title>Era Draw</title>
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head><body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <div class="bar hp"><i id="hpb"></i><span id="hpt"></span></div>
  <div class="bar xp"><i id="xpb"></i><span id="lvt"></span></div>
  <div id="stats"><span id="timer">0:00</span> · Wave <span id="wave">1</span> · <span id="kills">0</span>☠ · <span id="runcoins">0</span>🪙</div>
  <div id="slots"></div>
  <button id="pauseBtn">❚❚</button>
</div>
<div id="toast"></div>
<div id="screen"></div>
<div id="rotate" class="hidden"><div class="rot-ic">📱</div><h2>Rotate your phone</h2><div class="sub">Era Draw plays in landscape</div></div>
<script src="sprites.js"></script>
<script src="game.js"></script>
</body></html>
